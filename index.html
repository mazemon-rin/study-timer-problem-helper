<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>学習タイマー問題解説</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app-shell">
  <header><p class="eyebrow">STUDY SUPPORT</p><h1>問題解説アプリ</h1><p>問題を撮影して、わかりやすく質問できます</p></header>
  <section class="panel" data-screen="question"><h2>問題を質問</h2><p class="help">画像は端末内で縮小してから送信します。</p><div class="image-actions"><button type="button" class="primary" id="cameraButton">カメラで撮影</button><button type="button" id="libraryButton">画像を選択</button></div><input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment"><input id="libraryInput" class="visually-hidden" type="file" accept="image/*"><input id="problemImage" class="visually-hidden" type="file" accept="image/*"><img id="imagePreview" class="preview hidden" alt="問題画像のプレビュー" src=""><label>解析モデル<select id="analysisModel"><option value="gemini-3.5-flash">高性能：Gemini 3.5 Flash</option><option value="gemini-3.1-flash-lite">混雑回避：Gemini 3.1 Flash Lite</option></select></label><label>科目（任意）<select id="questionSubject"><option value="">AIに判断してもらう</option><option>数学</option><option>物理</option><option>化学</option><option>その他</option></select></label><button class="primary" id="solveButton" disabled>Geminiで解析</button><p id="questionStatus" class="status"></p><article id="solution" class="solution hidden"><h3 id="problemTextTitle">問題文</h3><p id="problemText"></p><details><summary>ヒント</summary><p id="hint"></p></details><details><summary>途中式</summary><div id="steps"></div></details><details><summary>最終解答</summary><p id="finalAnswer"></p></details><p id="explanation"></p><div id="followUpArea" class="follow-up hidden"><label for="followUpInput">追加で質問する</label><div class="follow-up-row"><input id="followUpInput" type="text" placeholder="この式を詳しく説明して"><button class="primary" id="followUpButton" type="button">質問する</button></div><p id="followUpStatus" class="status"></p><div id="followUpList"></div></div><button id="saveQuestionButton" disabled>復習に保存</button></article></section>
  <section class="panel hidden" data-screen="review"><div class="review-heading"><h2>復習</h2><button type="button" class="quiet" id="deleteAllQuestionsButton">保存した問題をすべて削除</button></div><div class="toolbar"><select id="reviewFilter"><option value="">すべての科目</option><option>数学</option><option>物理</option><option>化学</option><option>その他</option></select><select id="reviewSort"><option value="new">新しい順</option><option value="old">古い順</option></select></div><div id="reviewList"></div></section>
</main>
<nav class="bottom-nav"><button class="active" data-screen-link="question">▣<span>質問</span></button><button data-screen-link="review">↺<span>復習</span></button></nav>
<script type="module" src="app.js"></script>
</body></html>
