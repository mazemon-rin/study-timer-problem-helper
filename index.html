<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>学習タイマー問題解説</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app-shell">
  <header><p class="eyebrow">STUDY SUPPORT</p><h1>問題解説アプリ</h1><p>問題を撮影して、わかりやすく質問できます</p></header>
  <section class="panel hidden timer-panel" data-screen="timer">
    <label>科目<select id="subjectInput"><option value="">科目を選択</option><option>数学</option><option>物理</option><option>化学</option><option>その他</option></select></label>
    <div class="timer-display" id="timerDisplay">25:00</div><p class="timer-state" id="timerState">集中タイム</p>
    <div class="timer-actions"><button class="primary" id="startButton">開始</button><button id="pauseButton" disabled>一時停止</button><button class="quiet" id="resetButton">リセット</button></div>
    <div class="timer-settings"><label>集中時間<input id="focusMinutes" type="number" min="1" max="180" value="25"></label><label>休憩時間<input id="breakMinutes" type="number" min="1" max="60" value="5"></label></div>
    <div class="stats"><div><strong id="todayMinutes">0分</strong><span>今日の学習時間</span></div><div><strong id="questionCount">0</strong><span>今日の質問</span></div><div><strong id="reviewCount">0</strong><span>復習待ち</span></div></div>
    <div class="question-actions"><button class="accent" data-screen-link="question">問題を撮影・画像を選択</button></div>
  </section>
  <section class="panel" data-screen="question"><h2>問題を質問</h2><p class="help">画像は端末内で縮小してから送信します。</p><div class="image-actions"><button type="button" class="primary" id="cameraButton">カメラで撮影</button><button type="button" id="libraryButton">画像を選択</button></div><input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment"><input id="libraryInput" class="visually-hidden" type="file" accept="image/*"><input id="problemImage" class="visually-hidden" type="file" accept="image/*"><img id="imagePreview" class="preview hidden" alt="問題画像のプレビュー" src=""><label>科目（任意）<select id="questionSubject"><option value="">AIに判断してもらう</option><option>数学</option><option>物理</option><option>化学</option><option>その他</option></select></label><button class="primary" id="solveButton" disabled>Geminiで解析</button><p id="questionStatus" class="status"></p><article id="solution" class="solution hidden"><h3 id="problemTextTitle">問題文</h3><p id="problemText"></p><details><summary>ヒント</summary><p id="hint"></p></details><details><summary>途中式</summary><div id="steps"></div></details><details><summary>最終解答</summary><p id="finalAnswer"></p></details><p id="explanation"></p><button id="saveQuestionButton" disabled>復習に保存</button></article></section>
  <section class="panel hidden" data-screen="review"><div class="review-heading"><h2>復習</h2><button type="button" class="quiet" id="deleteAllQuestionsButton">保存した問題をすべて削除</button></div><div class="toolbar"><select id="reviewFilter"><option value="">すべての科目</option><option>数学</option><option>物理</option><option>化学</option><option>その他</option></select><select id="reviewSort"><option value="new">新しい順</option><option value="old">古い順</option></select></div><div id="reviewList"></div></section>
  <section class="panel hidden" data-screen="records"><h2>記録</h2><div class="stats large"><div><strong id="recordToday">0分</strong><span>今日</span></div><div><strong id="recordWeek">0分</strong><span>今週</span></div><div><strong id="recordQuestions">0</strong><span>質問数</span></div></div><div id="subjectRecords"></div></section>
</main>
<nav class="bottom-nav"><button class="active" data-screen-link="question">▣<span>質問</span></button><button data-screen-link="review">↺<span>復習</span></button></nav>
<script type="module" src="app.js"></script>
</body></html>
